[project]
name = "ida-rpc"
version = "0.1.1"
description = "CLI-driven daemon exposing IDA Pro reverse engineering capabilities over a Unix domain socket"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Bjoern Kerler", email = "info@revskills.de"},
]
dependencies = [
    "click>=8.1.0",
]
keywords = [
    "ida-pro",
    "ida",
    "reverse-engineering",
    "decompiler",
    "binary-analysis",
    "rpc",
]

[project.scripts]
ida-rpc = "ida_rpc.cli:main"
ida-rpcd = "ida_rpc.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ida_rpc"]

[tool.hatch.build.targets.wheel.force-include]
"ida_rpc_plugin.py" = "ida_rpc_plugin.py"
"AGENTS.md" = "AGENTS.md"
"KIMI.md" = "KIMI.md"
"SKILL.md" = "SKILL.md"

[tool.pi]
skills = ["./SKILL.md"]
